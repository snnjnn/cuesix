<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Studio</title>
  <link rel="stylesheet" href="index.css">
  <style>
    [x-cloak] {
      display: none !important
    }
  </style>
</head>

<body>

  <div id="schema-app" x-data="schemaApp" x-cloak :data-mode="mode">

    <nav class="navbar" role="navigation" aria-label="Primary" x-data="{ navbarOpen: false }">
      <div class="navbar-brand">
        <div class="navbar-item has-text-weight-semibold">API Studio</div>
        <a role="button" class="navbar-burger" aria-label="menu" :aria-expanded="navbarOpen.toString()"
          :class="{ 'is-active': navbarOpen }" @click="navbarOpen = !navbarOpen">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div class="navbar-menu" :class="{ 'is-active': navbarOpen }">
        <div class="navbar-start">
          <a href="#" class="navbar-item" :class="{ 'is-active': mode === 'index' }"
            @click.prevent="setMode('index'); navbarOpen = false">Index</a>
          <a href="#" class="navbar-item" :class="{ 'is-active': mode === 'browse' }"
            @click.prevent="setMode('browse'); navbarOpen = false">Sources</a>
          <a href="#" class="navbar-item" :class="{ 'is-active': mode === 'playground' }"
            @click.prevent="setMode('playground'); navbarOpen = false">Playground</a>
        </div>

        <div class="navbar-end">
          <a id="schema-json-link" href="../json" target="_blank" rel="noopener" class="navbar-item">Schema</a>
          <a id="openapi-link" href="../openapi" target="_blank" rel="noopener" class="navbar-item">OpenAPI</a>
          <a href="echo.html" class="navbar-item">Echo</a>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container is-widescreen">

        <div class="columns" x-show="mode !== 'index'">
          <div class="column is-two-thirds">
            <div class="block">
              <div x-show="mode === 'browse'">
                <div class="field is-grouped mb-1">
                  <div class="control">
                    <div class="select">
                      <select x-model="selectedSource">
                        <option value="">Select a source file...</option>
                        <template x-for="sourcePath in sources" :key="sourcePath">
                          <option :value="sourcePath"
                            x-text="sourcePath === '__sample__' ? 'Sample: inline.yml' : sourcePath"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <div class="control">
                    <button type="button" class="button is-link" :disabled="!selectedSource"
                      @click="loadSelectedSource()">Load</button>
                  </div>
                </div>
              </div>
              <div class="tabs" role="tablist" aria-label="Editor tabs">
                <ul>
                  <li :class="{ 'is-active': activeTab === 'yaml' }"><a href="#"
                      @click.prevent="setTab('yaml')">YAML</a>
                  </li>
                  <li :class="{ 'is-active': activeTab === 'env' }"><a href="#" @click.prevent="setTab('env')">Env
                      Vars</a></li>
                </ul>
              </div>
              <div x-show="activeTab === 'yaml'">
                <div class="mb-2" x-show="mode !== 'playground' && currentPath">
                  <p class="is-size-7 has-text-weight-semibold"
                    x-text="`${currentDocType === 'config' ? 'Config' : 'Source'} ${currentPath}`"></p>
                </div>
                <div x-ref="yamlEditorStandard"></div>
                <p class="help">Ctrl + Enter in the editor to validate</p>
              </div>
              <div x-show="activeTab === 'env'">
                <textarea class="textarea is-family-monospace" rows="18" spellcheck="false" placeholder="KEY=value"
                  x-model="envText" @keydown.ctrl.enter.prevent="revalidate()"></textarea>
                <p class="help">Ctrl + Enter to validate</p>
              </div>
            </div>
          </div>
          <div class="column">
            <div class="box">
              <nav class="level is-mobile">
                <div class="level-left">
                  <div class="level-item">Validation Output</div>
                </div>
                <div class="level-right">
                  <div class="level-item">
                    <div class="field has-addons">
                      <div class="control"><button type="button" class="button is-link is-small"
                          @click="revalidate()">Validate</button></div>
                      <div class="control" x-show="mode === 'playground'"><button type="button"
                          class="button is-light is-small" @click="resetSample()">Reset Sample</button></div>
                      <div class="control" x-show="mode === 'browse'"><button type="button"
                          class="button is-light is-small" @click="refreshSources()">Reload Sources</button></div>
                    </div>
                  </div>
                </div>
              </nav>
              <div class="block">
                <span class="tag" :class="statusTagClass">
                  <span x-text="statusText">Loading…</span>
                </span>
              </div>
              <div>
                <template x-for="(error, idx) in errors" :key="idx">
                  <div class="notification is-size-7">
                    <template x-if="error.location === '(root)'">
                      <p x-text="error.message"></p>
                    </template>
                    <template x-if="error.location !== '(root)'">
                      <div>
                        <p><code x-text="error.location + ':'"></code></p>
                        <p x-text="error.message"></p>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>

        <div class="container" x-show="mode === 'index'">
          <div class="block">
            <div class="field is-grouped is-grouped-multiline mb-4">
              <div class="control">
                <div class="field has-addons mb-0">
                  <div class="control">
                    <button type="button" class="button is-static">Gateway</button>
                  </div>
                  <div class="control">
                    <div class="select">
                      <select x-model="selectedVirtualGateway" @change="refreshIndex()">
                        <option value="" x-show="virtualGatewayNames.length === 0">None</option>
                        <template x-for="gateway in virtualGatewayNames" :key="gateway">
                          <option :value="gateway" x-text="gateway"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <div class="control">
                    <button type="button" class="button schema-vgw-indicator" :class="selectedVirtualGatewayIndicatorButtonClass" disabled :title="selectedVirtualGatewayReady === null ? 'Unknown readiness' : (selectedVirtualGatewayReady ? 'Gateway ready' : 'Gateway not ready')">
                      <span class="icon is-small"><i class="fa-solid" :class="[selectedVirtualGatewayIndicatorIcon, selectedVirtualGatewayIndicatorIconClass]"></i></span>
                    </button>
                  </div>
                </div>
              </div>
              <div class="control">
                <div class="field has-addons mb-0">
                  <div class="control">
                    <button type="button" class="button is-static">Kind</button>
                  </div>
                  <div class="control">
                    <div class="select">
                      <select x-model="selectedIndexKind" @change="applyIndexKindFilter()">
                        <option value="">All</option>
                        <template x-for="kind in indexKinds" :key="kind">
                          <option :value="kind" x-text="kind"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div class="control">
                <button type="button" class="button is-link" @click="reloadIndex()">Reload</button>
              </div>
              <div class="control">
                <button
                  type="button"
                  class="button is-light"
                  :class="{ 'is-static': !hasActiveIndexFilters() }"
                  :disabled="!hasActiveIndexFilters()"
                  @click="clearAllIndexFilters()"
                >Remove all filters</button>
              </div>
            </div>
            <div class="notification is-danger is-size-7" x-show="indexError" x-text="indexError"></div>
            <div class="mb-3" x-show="activeTagFilters.length > 0">
              <div class="is-flex is-align-items-center is-flex-wrap-wrap">
                <template x-for="(filter, idx) in activeTagFilters" :key="`${filter.key}:${filter.value}`">
                  <span class="tag is-medium mr-2 mb-2">
                    <span x-text="filter.value ? `${filter.key}=${filter.value}` : filter.key"></span>
                    <button type="button" class="delete is-small ml-1" @click="removeTagFilter(idx)"></button>
                  </span>
                </template>
              </div>
            </div>
              <table x-ref="indexTable" class="table is-striped stripe is-hoverable is-fullwidth">
                <thead>
                  <tr>
                    <th>Kind</th>
                    <th>ID</th>
                    <th>Details</th>
                    <th>Sources</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            <p class="help" x-show="indexRows.length === 0">No indexed resources found.</p>
          </div>
        </div>

      </div>
    </section>

    <div class="modal" :class="{ 'is-active': indexEditorModalOpen }" @keydown.escape.window="closeIndexEditorModal()"
      @contextmenu.prevent="closeIndexEditorModal()">
      <div class="modal-background" @click="closeIndexEditorModal()"></div>
      <div class="modal-card">
        <header class="modal-card-head">
          <p class="modal-card-title is-size-6">
            <span x-text="indexSelectionType === 'source' ? `Source ${currentPath || ''}` : `Config ${currentPath || ''}`"></span>
            <span class="is-size-7 has-text-grey ml-2">Left click or Escape to exit</span>
          </p>
          <button type="button" class="delete" aria-label="close" @click="closeIndexEditorModal()"></button>
        </header>
        <section class="modal-card-body">
          <div x-ref="yamlEditorIndex"></div>
        </section>
      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>

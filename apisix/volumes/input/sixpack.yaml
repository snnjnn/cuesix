upstreams:
  - id: acme-well-known
    nodes:
    - host: sixpack
      port: 8882
      weight: 1
    type: roundrobin

routes:
  - id: acme-well-known
    priority: 1000
    uri: /.well-known/acme-challenge/*
    upstream_id: acme-well-known
    plugins:
      limit-req:
        rate: 100
        burst: 200
        key: remote_addr
#END

upstreams:
  - id: grafana
    nodes:
      "192.168.231.2:3000": 1
    type: roundrobin

ssls:
  - id: grafana
    cert: acme://prod
    key:  acme://prod
    snis:
      - grafana.fivecorporation.com

routes:
  - id: grafana-acme
    priority: 1000
    uri: /.well-known/acme-challenge/*
    hosts:
      - grafana.fivecorporation.com
    upstream_id: acme-well-known
    plugins:
      limit-req:
        rate: 100
        burst: 200
        key: remote_addr
  - id: grafana-login
    uri: /login
    hosts:
      - grafana.fivecorporation.com
    upstream_id: grafana
    plugins:
      redirect:
        http_to_https: true
      limit-req:
        rate: 2
        burst: 5
        key: remote_addr
  - id: grafana
    uri: /*
    hosts:
      - grafana.fivecorporation.com
    upstream_id: grafana
    plugins:
      redirect:
        http_to_https: true
#END

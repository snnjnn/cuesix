routes:
  - id: baseline-all
    uri: /baseline/*
    plugins:
      proxy-rewrite:
        regex_uri:
          - "^/baseline/(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "upstream:18080": 1

  - id: nobuf-upload
    uri: /nobuf/upload
    plugins:
      proxy-control:
        request_buffering: false
      serverless-pre-function:
        phase: header_filter
        functions:
          - |
            local buffering = require("resty.sixpack")
            return function(conf, ctx)
                local ok, mode_or_err = buffering.set_proxy_buffering(false)
                if not ok then
                    ngx.log(ngx.ERR, "set_proxy_buffering failed: ", mode_or_err)
                    return 503
                end
                if mode_or_err ~= "immediate" then
                    ngx.log(ngx.ERR, "set_proxy_buffering expected immediate mode in header_filter, got: ", mode_or_err)
                end
            end
      proxy-rewrite:
        uri: /upload
    upstream:
      type: roundrobin
      nodes:
        "upstream:18080": 1

  - id: nobuf-all
    uri: /nobuf/*
    plugins:
      serverless-pre-function:
        phase: header_filter
        functions:
          - |
            local buffering = require("resty.sixpack")
            return function(conf, ctx)
                local ok, mode_or_err = buffering.set_proxy_buffering(false)
                if not ok then
                    ngx.log(ngx.ERR, "set_proxy_buffering failed: ", mode_or_err)
                    return 503
                end
                if mode_or_err ~= "immediate" then
                    ngx.log(ngx.ERR, "set_proxy_buffering expected immediate mode in header_filter, got: ", mode_or_err)
                end
            end
      proxy-rewrite:
        regex_uri:
          - "^/nobuf/(.*)"
          - "/$1"
    upstream:
      type: roundrobin
      nodes:
        "upstream:18080": 1

